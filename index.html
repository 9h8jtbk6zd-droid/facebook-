<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Location</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Share Your Location</h2>

  <p>
    Your GPS location will only be shared after you press
    the button and approve your browser's location request.
  </p>

  <button onclick="shareLocation()">
    Share My Location
  </button>

  <div id="result"></div>

</div>

<script>

  // PUT YOUR SUPABASE DETAILS HERE
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function shareLocation() {

    const result = document.getElementById("result");

    if (!navigator.geolocation) {
      result.innerHTML =
        "Your browser does not support GPS location.";
      return;
    }

    result.innerHTML =
      "Requesting your location...";

    navigator.geolocation.getCurrentPosition(

      async function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        result.innerHTML =
          "Location received. Sending...";


        const { error } =
          await supabaseClient
            .from("locations")
            .insert({
              latitude: latitude,
              longitude: longitude,
              accuracy: accuracy
            });


        if (error) {

          console.error(error);

          result.innerHTML =
            "There was a problem sending the location.";

          return;
        }


        const mapsURL =
          `https://www.google.com/maps?q=${latitude},${longitude}`;


        result.innerHTML = `
          <strong>Location shared successfully.</strong>
          <br><br>
          Accuracy: approximately
          ${Math.round(accuracy)} meters
          <br><br>
          <a href="${mapsURL}" target="_blank">
            View your location
          </a>
        `;

      },

      function(error) {

        if (error.code === 1) {
          result.innerHTML =
            "Location permission was denied.";
        }

        else if (error.code === 2) {
          result.innerHTML =
            "Your location could not be determined.";
        }

        else {
          result.innerHTML =
            "Unable to obtain your location.";
        }

      },

      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );

  }

</script>

</body>
</html>
