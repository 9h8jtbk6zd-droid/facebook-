<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Location</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }
    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    button {
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 25px;
      line-height: 1.7;
    }
    a {
      color: #007aff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Share Your Location</h2>
    <p>
      Click the button below to share your current GPS location.
      Your browser will ask for your permission first.
    </p>
    <button onclick="getLocation()">Share My Location</button>
    <div id="result"></div>
  </div>
  <script>
    function getLocation() {
      const result = document.getElementById("result");
      if (!navigator.geolocation) {
        result.innerHTML = "Geolocation is not supported by your browser.";
        return;
      }
      result.innerHTML = "Requesting your location...";
      navigator.geolocation.getCurrentPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;
          const mapsURL =
            `https://www.google.com/maps?q=${latitude},${longitude}`;
          result.innerHTML = `
            <strong>Location received.</strong><br><br>
            Latitude: ${latitude}<br>
            Longitude: ${longitude}<br>
            Accuracy: approximately ${Math.round(accuracy)} meters<br><br>
            <a href="${mapsURL}" target="_blank">
              Open Location in Google Maps
            </a>
          `;
        },
        function(error) {
          if (error.code === 1) {
            result.innerHTML =
              "Location permission was denied.";
          } else if (error.code === 2) {
            result.innerHTML =
              "Your location could not be determined.";
          } else {
            result.innerHTML =
              "Unable to obtain your location.";
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
